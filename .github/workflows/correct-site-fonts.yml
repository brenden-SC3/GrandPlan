name: Correct site fonts to Montserrat and Lora

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/correct-site-fonts.yml'

permissions:
  contents: write

concurrency:
  group: correct-site-fonts
  cancel-in-progress: false

jobs:
  correct-fonts:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate and correct typography references
        run: |
          python3 - <<'PY'
          import os
          import re
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          public = Path('public')
          pages = sorted(public.glob('*.html'))
          if len(pages) != 10:
              raise SystemExit('Expected ten HTML pages; no files changed.')
          font_css = public / 'assets/css/fonts.css'
          if font_css.exists():
              raise SystemExit('fonts.css already exists; refusing to overwrite it.')
          families = {'Poppins': 'Montserrat', 'Lato': 'Montserrat', 'Playfair Display': 'Lora'}
          quoted = re.compile(r'''(['"])(Poppins|Lato|Playfair Display)\1''')
          def correct(text):
              return quoted.sub(lambda m: m[1] + families[m[2]] + m[1], text)
          class Link(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  self.attrs = dict(attrs)
          pending = []
          for page in pages:
              original = page.read_bytes().decode('utf-8')
              head = re.search(r'(<head\b[^>]*>)(.*?)(</head\s*>)', original, re.I | re.S)
              if not head:
                  raise SystemExit('Missing head: ' + page.name)
              imports = []
              def replace_link(match):
                  parser = Link()
                  parser.feed(match[0])
                  attrs = parser.attrs
                  href = attrs.get('href') or ''
                  rel = (attrs.get('rel') or '').lower().split()
                  if urlsplit(href).hostname == 'fonts.googleapis.com':
                      if 'stylesheet' in rel:
                          imports.append(href)
                          return '<link rel="stylesheet" href="/assets/css/fonts.css">'
                      if 'preload' in rel and (attrs.get('as') or '').lower() == 'style':
                          return ''
                  return match[0]
              inner = re.sub(r'<link\b[^>]*>', replace_link, head[2], flags=re.I)
              if len(imports) != 1:
                  raise SystemExit('Expected one Google Fonts stylesheet on ' + page.name + '; no files changed.')
              inner = correct(inner)
              updated = original[:head.start()] + head[1] + inner + head[3] + original[head.end():]
              if any(name in updated for name in families):
                  raise SystemExit('Unconverted old font reference on ' + page.name + '; no files changed.')
              pending.append((page, updated))
          for css in sorted((public / 'assets/css').glob('*.css')):
              original = css.read_bytes().decode('utf-8')
              updated = correct(original)
              if any(name in updated for name in families):
                  raise SystemExit('Unexpected font syntax in ' + str(css) + '; no files changed.')
              if updated != original:
                  pending.append((css, updated))
          url = 'https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap'
          font_css.write_text('/* Shared font loading: Montserrat for sans-serif text, Lora for serif accents. */\n@import url("' + url + '");\n', encoding='utf-8')
          for path, updated in pending:
              path.write_bytes(updated.encode('utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Corrected all ten page heads and matching shared CSS declarations. Added shared fonts.css with Montserrat and Lora, regular and italic weights 400–700. Removed obsolete Google Fonts stylesheet preloads. Page bodies, sizes, weights, spacing, embeds, and indexing directives were preserved.\n')
              for path, _ in pending:
                  summary.write('- ' + path.as_posix() + '\n')
          PY
      - name: Commit font correction and remove temporary workflow
        run: |
          git add -- public
          git rm -- .github/workflows/correct-site-fonts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Correct site typography to Montserrat and Lora'
          git push origin HEAD:main
